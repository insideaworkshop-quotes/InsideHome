<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Quote</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#eef7ff,#d7ebff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:800px;
    background:#ffffff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#2c6fb7;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    font-size:16px;
}

textarea{
    min-height:160px;
    resize:vertical;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#ff9900;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e68a00;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
}
</style>

</head>
<body>

<div class="container">

```
<h1>Request a Quote</h1>

<p class="subtitle">
    Fill out the form below and we'll get back to you as soon as possible.
</p>

<form id="quoteForm">

    <input
        type="text"
        name="name"
        placeholder="Your Name"
        required>

    <input
        type="email"
        name="email"
        placeholder="Your Email Address"
        required>

    <input
        type="tel"
        name="phone"
        placeholder="Phone Number">

    <textarea
        name="quote_details"
        placeholder="Tell us what quote you need..."
        required></textarea>

    <button type="submit">
        Submit Quote Request
    </button>

</form>

<div class="footer">
    Fast responses • Professional service • Free quotes
</div>
```

</div>

<script>
document.getElementById('quoteForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = e.target;
    const data = new FormData(form);

    const response = await fetch('https://formspree.io/f/xbdebwgj', {
        method: 'POST',
        body: data,
        headers: {
            'Accept': 'application/json'
        }
    });

    if (response.ok) {
        window.location.href = 'thanks.html';
    } else {
        alert('There was a problem submitting your request. Please try again.');
    }
});
</script>

</body>
</html>
