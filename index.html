<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#eaf4ff,#cfe6ff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:800px;
    background:#ffffff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#2c6fb7;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    font-size:16px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#ff9900;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e68a00;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
}
</style>

</head>

<body>

<div class="container">

```
<h1>Request a Quote</h1>

<p class="subtitle">
    Fill in the form below and we'll get back to you shortly.
</p>

<form action="https://formspree.io/f/xbdebwgj" method="POST">

    <input
        type="text"
        name="name"
        placeholder="Your Name"
        required>

    <input
        type="email"
        name="email"
        placeholder="Your Email Address"
        required>

    <input
        type="tel"
        name="phone"
        placeholder="Phone Number">

    <textarea
        name="quote_details"
        placeholder="Tell us what quote you need..."
        required></textarea>

    <input
        type="hidden"
        name="_next"
        value="https://insideaworkshop-quotes.github.io/InsideHome/thanks.html">

    <button type="submit">
        Submit Quote Request
    </button>

</form>

<div class="footer">
    Fast responses • Professional service • Free quotes
</div>
```

</div>

</body>
</html>
