<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Quote</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background: linear-gradient(135deg,#ffffff,#fff6cc);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:white;
    width:100%;
    max-width:700px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.logo-placeholder{
    width:180px;
    height:80px;
    margin:0 auto 25px;
    border:3px dashed #ff9900;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    border-radius:10px;
}

h1{
    text-align:center;
    color:#0066cc;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

form{
    display:grid;
    gap:15px;
}

input, textarea{
    width:100%;
    padding:14px;
    border:2px solid #e5e5e5;
    border-radius:10px;
    font-size:16px;
}

input:focus, textarea:focus{
    outline:none;
    border-color:#0066cc;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    background:#ff9900;
    color:white;
    border:none;
    padding:15px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#e68300;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">

    <!-- Replace this with your logo image -->
    <div class="logo-placeholder">
        YOUR LOGO HERE
    </div>

    <h1>Request a Quote</h1>

    <p class="subtitle">
        Complete the form below and we'll get back to you.
    </p>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required>

        <input
            type="tel"
            name="phone"
            placeholder="Phone Number">

        <textarea
            name="quote_details"
            placeholder="Tell us what quote you need..."
            required></textarea>

        <button type="submit">
            Submit Quote Request
        </button>

    </form>

    <div class="footer">
        We'll respond as soon as possible.
    </div>

</div>

</body>
</html>
