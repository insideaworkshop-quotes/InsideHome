<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Free Quote</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f9ff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:850px;
    background:#ffffff;
    border-radius:24px;
    padding:50px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    color:#4a7db8;
    font-size:42px;
    margin-bottom:15px;
}

.subtitle{
    text-align:center;
    color:#666;
    font-size:18px;
    margin-bottom:35px;
}

input,
textarea{
    width:100%;
    padding:16px;
    border:1px solid #dbe7f5;
    border-radius:12px;
    margin-bottom:15px;
    font-size:16px;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#7faee6;
}

textarea{
    min-height:180px;
    resize:vertical;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#ff9f1c;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#f08f00;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#999;
}
</style>

</head>
<body>

<div class="container">

```
<h1>Request a Quote</h1>

<p class="subtitle">
    Tell us what you need and we'll get back to you as soon as possible.
</p>

<form id="quoteForm">

    <input
        type="text"
        name="name"
        placeholder="Your Name"
        required>

    <input
        type="email"
        name="email"
        placeholder="Your Email Address"
        required>

    <input
        type="tel"
        name="phone"
        placeholder="Phone Number">

    <textarea
        name="quote_details"
        placeholder="Describe what you'd like a quote for..."
        required></textarea>

    <button type="submit">
        Get My Quote
    </button>

</form>

<div class="footer">
    Fast responses • Free quotations
</div>
```

</div>

<script>
document.getElementById("quoteForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData(this);

    const response = await fetch(
        "https://formspree.io/f/xbdebwgj",
        {
            method: "POST",
            body: formData,
            headers: {
                "Accept": "application/json"
            }
        }
    );

    if(response.ok){
        window.location.href = "thanks.html";
    } else {
        alert("There was a problem sending your quote request.");
    }

});
</script>

</body>
</html>
