```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Quote</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ffffff,#fff8d6);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:750px;
    background:#ffffff;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
    border-top:6px solid #ff9900;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

/* Replace logo.png with your logo filename */
.logo img{
    max-width:220px;
    width:100%;
    height:auto;
}

/* Temporary placeholder if logo isn't uploaded yet */
.logo-placeholder{
    width:220px;
    height:90px;
    margin:0 auto;
    border:3px dashed #ff9900;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#0066cc;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    line-height:1.5;
}

form{
    display:grid;
    gap:15px;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:2px solid #e5e5e5;
    border-radius:10px;
    font-size:16px;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#0066cc;
}

textarea{
    min-height:160px;
    resize:vertical;
}

button{
    background:#ff9900;
    color:white;
    border:none;
    border-radius:10px;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#e68300;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">

        <!-- OPTION 1: Uncomment this after uploading your logo -->
        <!-- <img src="logo.png" alt="Company Logo"> -->

        <!-- OPTION 2: Placeholder until logo is uploaded -->
        <div class="logo-placeholder">
            YOUR LOGO HERE
        </div>

    </div>

    <h1>Request a Quote</h1>

    <p class="subtitle">
        Fill out the form below and we'll get back to you as soon as possible.
    </p>

    <form action="https://formspree.io/f/xaqzkazb" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Your Email Address"
            required>

        <input
            type="tel"
            name="phone"
            placeholder="Phone Number">

        <textarea
            name="quote_details"
            placeholder="Please tell us what quote you need..."
            required></textarea>

        <button type="submit">
            Submit Quote Request
        </button>

    </form>

    <div class="footer">
        Thank you for your enquiry.
    </div>

</div>

</body>
</html>
```
